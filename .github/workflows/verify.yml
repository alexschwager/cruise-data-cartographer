name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Structural audit of the shipped map (offline, stdlib, no API key)
        run: python3 tests/verify.py map
      - name: Self-test — the verifier must reject the photocopy card
        run: python3 tests/verify.py selftest
